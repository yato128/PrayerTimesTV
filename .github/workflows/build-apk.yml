
name: Build PrayerTimesTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f PrayerTimesTV/settings.gradle.kts ]; then
            echo "PROJECT_DIR=PrayerTimesTV" >> "$GITHUB_ENV"
          else
            echo "Project files not found"
            exit 1
          fi

      - name: Check project files
        run: |
          cd "$PROJECT_DIR"
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTimesTV-APK
          path: PrayerTimesTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
